# Ce fichier est utilisé en PRODUCTION par Ansible.
# Les images proviennent du registry GitLab (pas de build local).
# Les variables sont injectées via le fichier .env créé par Ansible.

services:
  frontend:
    image: "${FRONTEND_IMAGE}"
    container_name: typing_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      APP_ENV: "${APP_ENV:-production}"
    depends_on:
      - backend
    networks:
      - typing_network

  backend:
    image: "${BACKEND_IMAGE}"
    container_name: typing_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://typing_user:${DB_PASSWORD}@db:5432/typing_db"
      ANALYSIS_SERVICE_URL: "http://analysis:8080"
    depends_on:
      db:
        condition: service_healthy
      analysis:
        condition: service_started
    networks:
      - typing_network

  analysis:
    image: "${ANALYSIS_IMAGE}"
    container_name: typing_analysis
    restart: always
    ports:
      - "8080:8080"
    networks:
      - typing_network

  db:
    image: postgres:16
    container_name: typing_db
    restart: always
    environment:
      POSTGRES_USER: typing_user
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: typing_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typing_user -d typing_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - typing_network

volumes:
  postgres_data:

networks:
  typing_network:
    driver: bridge
